name: Alertes Vinted Discord
on:
  workflow_dispatch:
jobs:
  alertes:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true
      - name: Compiler le bot
        run: go build -o worker ./cmd/cmd/worker/main.go
      - name: Rechercher les annonces et envoyer sur Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEARCH_QUERY: ${{ secrets.SEARCH_QUERY }}
          MAX_PRICE: ${{ secrets.MAX_PRICE }}
        run: ./worker
