name: Vérifier le bot Vinted

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Compiler le bot
        run: go build -o worker ./cmd/test-scraper/main.go

      - name: Vérifier Docker Compose
        run: docker compose config
